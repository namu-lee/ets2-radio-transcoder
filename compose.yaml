name: ets2-radio

services:
  icecast:
    image: libretime/icecast:2.5.0
    restart: unless-stopped

    environment:
      ICECAST_SOURCE_PASSWORD: ets2radio
      ICECAST_ADMIN_USERNAME: admin
      ICECAST_ADMIN_PASSWORD: admin
      ICECAST_HOSTNAME: localhost
      ICECAST_MAX_CLIENTS: "100"
      ICECAST_MAX_SOURCES: "16"

    ports:
      - "127.0.0.1:8000:8000"
      
    volumes:
      - ./icecast.xml:/etc/icecast.xml:ro

  radio:
    image: lscr.io/linuxserver/ffmpeg:version-9.0-cli
    restart: unless-stopped
    init: true

    depends_on:
      - icecast

    volumes:
      - ./:/app

    entrypoint:
      - /bin/sh
      - /app/transcode.sh
